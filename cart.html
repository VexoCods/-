<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Order — Caffeine Cove</title>
<meta name="description" content="Review your Caffeine Cove order, adjust quantities and choose a pickup time.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#100d0b">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="cart">
<a class="skip-link" href="#main">Skip to content</a>
<header data-header></header>

<main id="main">

  <section class="page-hero">
    <div class="container">
      <p class="label label--plain">Order</p>
      <h1 class="page-hero__title">Your order</h1>
      <p class="lead page-hero__lead"><span data-cart-count-label>0 items</span> · collected from Harbour Lane</p>
    </div>
  </section>

  <section class="section">
    <div class="container">

      <div class="empty-state" data-cart-empty hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 8h13l1 12h-15z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <h2 class="menu-section__title">Your order is empty</h2>
        <p>Nothing here yet. Have a look at the menu and add something you fancy.</p>
        <a class="btn btn--primary" href="menu.html">Explore the menu</a>
      </div>

      <div data-cart-main>
        <div class="cart-layout">
          <div class="cart-panel">
            <h2 class="cart-panel__title">Items</h2>
            <div data-cart-lines></div>
          </div>

          <div class="cart-panel cart-panel--sticky">
            <h2 class="cart-panel__title">Summary</h2>
            <div class="totals" data-cart-totals></div>
            <button class="btn btn--primary btn--block" type="button" data-continue style="margin-top:1.4rem">Continue to Checkout</button>
            <p class="menu-intro__note" style="margin-top:0.9rem">No payment taken online — you'll settle up at the counter.</p>
          </div>
        </div>

        <div class="cart-panel" data-checkout-panel hidden style="margin-top:clamp(1.5rem,3vw,2.5rem)">
          <h2 class="cart-panel__title">Pickup details</h2>
          <form class="checkout-steps" data-checkout-form novalidate>
            <div class="field-grid field-grid--2">
              <div class="field">
                <label class="field__label" for="checkout-name">Name</label>
                <input class="input" id="checkout-name" name="name" type="text" autocomplete="name" placeholder="Alex Moreau" required>
                <span class="field__error" aria-live="polite"></span>
              </div>
              <div class="field">
                <label class="field__label" for="checkout-phone">Phone</label>
                <input class="input" id="checkout-phone" name="phone" type="tel" autocomplete="tel" placeholder="+45 20 14 22 80" required>
                <span class="field__error" aria-live="polite"></span>
              </div>
            </div>

            <div class="field-grid field-grid--2">
              <div class="field">
                <label class="field__label" for="checkout-email">Email</label>
                <input class="input" id="checkout-email" name="email" type="email" autocomplete="email" placeholder="alex@example.com">
                <span class="field__error" aria-live="polite"></span>
              </div>
              <div class="field">
                <label class="field__label" for="checkout-time">Ready for</label>
                <select class="select" id="checkout-time" name="time">
                  <option>As soon as possible</option>
                  <option>In 15 minutes</option>
                  <option>In 30 minutes</option>
                  <option>In an hour</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label class="field__label" for="checkout-notes">Notes for the bar</label>
              <textarea class="textarea" id="checkout-notes" name="notes" placeholder="Allergies, a name for the cup, anything else…"></textarea>
            </div>

            <button class="btn btn--primary btn--lg btn--block" type="submit">Place order</button>
          </form>
        </div>
      </div>

      <div data-checkout-success hidden></div>

    </div>
  </section>

</main>

<footer data-footer></footer>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
