<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved Properties — Horizon Properties</title>
<meta name="description" content="Your shortlisted Horizon Properties houses, saved in this browser.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0A1626">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="favorites">
<a class="skip-link" href="#main">Skip to content</a>
<header data-header></header>

<main id="main">

  <section class="page-hero">
    <div class="container page-hero__inner">
      <p class="label">Shortlist</p>
      <h1 class="page-hero__title">Saved properties</h1>
      <p class="lead">
        <strong data-saved-page-count>0</strong> houses saved in this browser. Use the heart on any card — or on a
        property page — to add or remove it.
      </p>
    </div>
  </section>

  <section class="section section--flush-top">
    <div class="container">
      <div class="active-filters" style="justify-content:flex-end">
        <button class="btn btn--outline btn--sm" type="button" data-clear-shortlist hidden>Clear shortlist</button>
      </div>

      <div class="results-grid" data-saved-grid style="padding-bottom:var(--s-6)"></div>

      <div class="empty-state" data-saved-empty hidden>
        <span class="empty-state__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2C9.9 18.6 4.5 14.9 4.5 10.6A4.1 4.1 0 0 1 12 8.1a4.1 4.1 0 0 1 7.5 2.5c0 4.3-5.4 8-7.5 9.6Z"/></svg>
        </span>
        <h2 class="h3">Nothing saved yet</h2>
        <p class="muted" style="max-width:32rem">
          Browse the portfolio and tap the heart on the houses you would like to compare.
        </p>
        <a class="btn" href="properties.html">
          <span>Browse properties</span>
          <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12h14"/><path d="m13 6.5 5.5 5.5-5.5 5.5"/></svg>
        </a>
      </div>
    </div>
  </section>

</main>

<footer data-footer></footer>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
