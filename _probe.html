<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>probe</title>
<style>
  body { margin: 0; background: #fff; color: #000; font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre { margin: 0; padding: 6px 8px; white-space: pre; }
  iframe { display: block; border: 0; }
</style>
</head>
<body>
<pre id="out">…</pre>
<script>
  const rows = [];
  const paint = () => { document.getElementById('out').textContent = rows.join('\n'); };

  function probe(frame) {
    const label = frame.dataset.label;
    const d = frame.contentDocument;
    const w = frame.contentWindow;
    if (!d || !w) { rows.push(label + ': NO DOC'); return paint(); }

    const css = (sel, prop) => {
      const el = d.querySelector(sel);
      return el ? w.getComputedStyle(el)[prop] : 'MISSING';
    };
    const nat = (sel) => {
      const img = d.querySelector(sel);
      return img ? `${img.naturalWidth}x${img.naturalHeight}` : 'MISSING';
    };
    const ov = d.documentElement.scrollWidth - d.documentElement.clientWidth;
    const hf = `${d.querySelector('.header .brand') ? 'y' : 'N'}/${d.querySelector('.footer__top') ? 'y' : 'N'}`;
    const R = (s) => rows.push(`${label.padEnd(13)} ${s}`);
    paint();

    R(`overflow=${ov} header/footer=${hf}`);

    if (label === 'home@1440') {
      R(`btnLight bg=${css('.btn--light', 'backgroundColor')} fg=${css('.btn--light', 'color')}`);
      R(`btnGhost bg=${css('.btn--ghost', 'backgroundColor')} bd=${css('.btn--ghost', 'borderColor')}`);
      R(`h1 font=${css('.hero__title', 'fontFamily').slice(0, 20)} size=${css('.hero__title', 'fontSize')}`);
      R(`body font=${css('body', 'fontFamily').slice(0, 20)} label=${css('.label', 'color')}`);
      R(`heroImg=${nat('.hero__media img')} cards=${d.querySelectorAll('[data-featured-carousel] .card').length} cardImg=${nat('[data-featured-carousel] .card img')}`);
      R(`services=${d.querySelectorAll('.service-row').length} team=${d.querySelectorAll('.team-card').length} arrows=${d.querySelectorAll('[data-carousel-prev]').length}`);
      R(`h2 size=${css('.h2', 'fontSize')} grid=${css('.grid-cards', 'gridTemplateColumns')}`);
    }

    if (label === 'props@1440') {
      R(`results=${d.querySelectorAll('[data-results] .card').length} selects=${d.querySelectorAll('.filters__bar select').length}`);
      R(`count="${d.querySelector('[data-results-count]')?.textContent.trim()}" cols=${css('.results-grid', 'gridTemplateColumns')}`);
      R(`cardImg=${nat('[data-results] .card img')} chips=${d.querySelectorAll('.chip-removable').length}`);
    }

    if (label === 'detail@1440') {
      R(`title="${d.querySelector('.detail-head__title')?.textContent.trim()}" price=${d.querySelector('.detail-head__price strong')?.textContent.trim()}`);
      R(`gallery=${d.querySelectorAll('.gallery__cell').length} img=${nat('.gallery__cell img')} lightbox=${d.getElementById('lightbox') ? 'y' : 'N'}`);
      R(`features=${d.querySelectorAll('.feature-grid li').length} amenities=${d.querySelectorAll('.chip-list li').length} agent="${d.querySelector('.agent-card__name')?.textContent.trim()}"`);
      R(`similar=${d.querySelectorAll('[data-similar-carousel] .card').length} cols=${css('.detail-body', 'gridTemplateColumns')}`);
    }

    if (label.endsWith('@390')) {
      R(`h1=${css('.hero__title', 'fontSize')} toggle=${css('.menu-toggle', 'display')} nav=${css('.header__nav', 'display')}`);
      R(`about=${css('.about-grid', 'gridTemplateColumns')} side=${css('.about-collage__side', 'display')}`);
      R(`mobileCta=${css('.mobile-cta', 'display')} filterBarMaxH=${css('.filters__bar', 'maxHeight')} filtersToggle=${css('[data-filters-toggle]', 'display')}`);
    }
  }

  const frames = [];
  const html = (
    [
      ['home@1440', 'index.html', 1440],
      ['props@1440', 'properties.html', 1440],
      ['detail@1440', 'property.html?id=palm-garden-residence', 1440],
      ['home@390', 'index.html', 390],
      ['props@390', 'properties.html', 390],
      ['detail@390', 'property.html?id=palm-garden-residence', 390],
    ]
  );
  window.__specs = html;
</script>
<script>
  // Frames are declared after the helper above so their load events are captured.
  document.write(window.__specs.map(([label, src]) => `<iframe data-label="${label}" width="1440" height="1500" src="${src}" style="width:${label.endsWith('390') ? 390 : 1440}px"></iframe>`).join(''));
</script>
<script>
  const frames = Array.from(document.querySelectorAll('iframe'));
  frames.forEach((frame) => {
    frame.addEventListener('load', () => {
      try { probe(frame); } catch (error) { rows.push(`${frame.dataset.label}: ERROR ${error.message}`); paint(); }
    });
  });
  window.addEventListener('load', () => {
    rows.push('--- all frames settled: ' + new Date().toISOString().slice(11, 19) + ' ---');
    paint();
  });
</script>
</body>
</html>
