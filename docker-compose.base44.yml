# ---------------------------------------------------------------------------
# Base44 development environment for the Digital Menu app.
#
# Differences from a normal production deployment, and why:
#   * The container runs the *base* Dockerfile stage with the repository
#     bind-mounted, so edits show up immediately (live reload via `node --watch`).
#   * Dependencies live in a named volume and are installed at container start
#     from the locked package-lock.json (nothing is baked into the image).
#   * `BASE44_PREVIEW_MODE=1` and the host allowlist are passed through so the
#     preview proxy origin is accepted. With the flag unset, the app keeps its
#     normal behaviour (no extra allowed hosts, no relaxed settings).
#   * HTTPS/HSTS are NOT forced here: the preview proxy terminates TLS.
#     Production sets FORCE_HTTPS=1 and TRUST_PROXY=1 (see .env.example).
# ---------------------------------------------------------------------------

services:
  menu-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    restart: on-failure
    ports:
      # The preview always proxies host port 3000.
      - "3000:3000"
    volumes:
      # Live source code (edits appear without rebuilding).
      - .:/app
      # Dependencies: installed on startup from package-lock.json.
      - menu_node_modules:/app/node_modules
      # Persistent SQLite database + uploaded images.
      - menu_data:/app/data
    environment:
      # Passed through as-is by the platform (bare variable, no value here).
      - BASE44_PREVIEW_MODE
      - NODE_ENV=development
      - PORT=3000
      - DATA_DIR=/app/data
      - TRUST_PROXY=1
      - FORCE_HTTPS=0
      - SEED_DEMO=1
      # Public address of the menu, so the admin QR code points at the live
      # preview. Referenced through the variable, never hardcoded.
      - PUBLIC_BASE_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      # Host-header allowlist (defence in depth). The sandbox id rotates, so we
      # allow the proxy domain wildcards. Unset ALLOWED_HOSTS in production.
      - ALLOWED_HOSTS=*.${BASE44_SANDBOX_HOST_DOMAIN},*.${BASE44_PUBLIC_HOST_SUFFIX},localhost,127.0.0.1
    env_file:
      # Platform-managed secrets (SESSION_SECRET, ADMIN_*, ...). Kept OUTSIDE
      # the repo. Listed LAST so real values always win over any default.
      # `required: false` keeps the stack bootable before secrets are provided.
      - path: /run/base44/app.env
        required: false
    # Install dependencies after the mounts are in place, then start the dev
    # server with file watching enabled.
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        exec npm run dev
    healthcheck:
      # Node 22 has fetch built in; probe the app's own health endpoint.
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  menu_node_modules:
  menu_data:
